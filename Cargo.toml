[package]
name = "rust-fest"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Essential Rust utility types. no_std + alloc, optional Serde."
readme = "README.md"
license = "MIT OR CC0-1.0"
repository = "https://github.com/nonomnonom/rust-fest"
keywords = ["types", "utilities", "newtype", "nonempty", "type-safety"]
categories = ["rust-patterns", "data-structures", "no-std"]
include = ["/src/**", "/examples/**", "/tests/**", "/changesets/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

[features]
default = []
serde = ["dep:serde"]
either = ["dep:either"]
schemars = ["dep:schemars"]

[dependencies]
either = { version = "1.19", optional = true, default-features = false }
schemars = { version = "1.2", optional = true, default-features = false, features = ["derive"] }
serde = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
itertools = { version = "0.15", default-features = false }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "api_payload"
required-features = ["serde"]

[[example]]
name = "json_schema"
required-features = ["schemars"]
